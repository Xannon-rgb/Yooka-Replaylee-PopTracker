name: Update PopTracker release feed

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_versions.py'
      - '.github/workflows/update-versions.yml'
  # Also catch assets attached after a release was published.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: poptracker-release-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate release assets and build update feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_versions.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- versions.json; then
            echo "Update feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update PopTracker release feed"
          git push origin HEAD:main
