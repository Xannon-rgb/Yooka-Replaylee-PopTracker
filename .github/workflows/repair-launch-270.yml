name: Repair 2.70 launch release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-launch-270.yml']
permissions:
  contents: write
concurrency:
  group: poptracker-release-feed
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish corrected ZIP and preserve original
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/repair_launch.py
      - name: Refresh release feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_versions.py
      - name: Commit updated feed
        run: |
          if git diff --quiet -- versions.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Point PopTracker update feed at verified 2.70.0 launch"
          git push origin HEAD:main
